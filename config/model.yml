# Model-wide configuration for Milestone 1 (repository setup + four-quarter data proof).
# Every field here is either verified against a source document or explicitly marked
# candidate/pending. Nothing here should be read as a confirmed fact until the
# corresponding source file has been inspected.

company:
  name: "Target Corporation"
  cik: "0000027419"
  ticker: "TGT"
  exchange: "NYSE"
  status: verified            # confirmed 2026-09-14 against CIK0000027419-submissions.json:
                               # name="TARGET CORP", tickers=["TGT"], exchanges=["NYSE"],
                               # formerNames includes "DAYTON HUDSON CORP" (Target's known
                               # legal predecessor name). See docs/decisions.md.
  fiscal_year_end_nominal: "0201"   # SEC's nominal MM-DD; actual period-end dates float
                                     # (Saturday nearest Jan 31) — see docs/decisions.md

information_cutoff: "2026-09-14"   # approved 2026-09-14 — see docs/decisions.md

fiscal_year:
  proof_year: 2025             # Target's internal fiscal-year label; period 2025-02-02 to
                                # 2026-01-31. Approved 2026-09-14 — see docs/decisions.md

units:
  normalized_unit: "USD_millions"
  decimal_places: 2
  arithmetic: "python.decimal.Decimal"   # never binary float for financial values

# Validation methodology, corrected 2026-09-15 (see docs/decisions.md and
# docs/accounting_policies.md for full derivation and worked examples). The
# earlier "annual_vs_quarters" / "derived_quarter_calculation" categories were
# REMOVED: comparing a sum of quarters against an annual total is tautological
# whenever one quarter (always Q4 here) was derived as the residual — that
# equality is algebraically guaranteed, not evidence about the data. That
# class of self-consistency check is now an arithmetic invariant (see
# src/target_cash/reconcile.py:check_arithmetic_invariant), which is reported
# separately from genuine independent validation and never conflated with it.
#
# Three of the categories below use `compute_rounding_bound`, a documented
# worst-case propagated-rounding bound — not an arbitrary flat figure. Each
# independently-rounded reported component contributes half of Target's
# reporting unit ($1M, so $0.5M) to the bound; a YTD-derived component
# contributes twice that, since it inherits rounding error from both of the
# two facts it was subtracted from. The bound is computed per check instance
# from the actual number of such components feeding it (see
# docs/accounting_policies.md worked examples for the annual-roll-forward and
# independent-quarter-validation cases) — it is not a single fixed number
# stored here. None of this uses a relative percentage: a relative tolerance
# scales with the balance being checked, which would mask a fixed-dollar
# error in a large-magnitude figure or be meaninglessly loose near zero.
reconciliation_tolerance:
  reporting_unit_usd_millions: 1.0   # Target rounds its statements to the nearest $1M;
                                      # half of this is the per-component rounding bound

  source_compatibility:
    # No numeric tolerance — a precondition gate (entity, fiscal year, unit,
    # accounting basis, consolidated scope, start/end dates, filing version,
    # sign convention). Any failed dimension blocks the derivation outright;
    # see reconcile.check_source_compatibility.
    tolerance: "n/a — pass/fail precondition, not a numeric comparison"

  arithmetic_invariant:
    # No numeric tolerance — recomputing a derivation formula must produce
    # exactly the stored value, or the code has a bug. This checks the code,
    # not the data — see reconcile.check_arithmetic_invariant's docstring.
    tolerance: "n/a — exact equality of a recomputation, not a data check"

  independent_quarter_validation:
    # Compares a YTD-derived quarter (2 rounding-error-contributing inputs)
    # against a separately-filed discrete-quarter fact (1 rounding-error-
    # contributing input) when one exists. Bound = compute_rounding_bound(
    # num_directly_reported_components=1, num_ytd_derived_components=1) =
    # (1 + 2*1) * (1.0/2) = $1.5M. When no independent fact exists (always
    # true for Q4), the result is labeled "unavailable", never a pass.
    worked_example_usd_millions: 1.5

  ytd_consistency:
    # Compares a directly-filed YTD fact against the sum of three directly-
    # filed discrete quarters — genuinely independent since neither side was
    # derived from the other. Bound = compute_rounding_bound(
    # num_directly_reported_components=4, num_ytd_derived_components=0) =
    # (4 + 0) * (1.0/2) = $2.0M.
    worked_example_usd_millions: 2.0

  cash_rollforward:
    # Beginning cash + CFO + CFI + CFF + FX effect vs. reported ending cash.
    # The component count (and therefore the bound) depends on whether CFO/
    # CFI/CFF/FX for the specific period being checked are directly reported
    # (true for an annual roll-forward) or YTD-derived (true for a Q2/Q3
    # roll-forward, since Target's cash-flow statement is YTD-only in 10-Qs).
    # Annual worked example: 6 directly-reported components (beginning cash,
    # CFO, CFI, CFF, FX, ending cash) -> compute_rounding_bound(6, 0) =
    # (6 + 0) * (1.0/2) = $3.0M. The residual is always reported, even when
    # it falls inside the bound — never silently absorbed.
    worked_example_annual_usd_millions: 3.0

  excel_vs_python:
    # Kept separate from the rounding-bound method above (per explicit
    # instruction): Excel and Python compute the identical formula on
    # identical inputs, so this is not about propagated filing-rounding at
    # all — any difference should only be binary-float vs. Decimal rounding
    # noise at the last displayed digit.
    absolute_usd_millions: 0.01
    relative_pct: 0

data_source:
  mode: "manual_upload"       # this Claude Code remote environment has no network egress
                               # to data.sec.gov / www.sec.gov; see docs/limitations.md
  user_agent_contact: "jaypatelaitools@gmail.com"

mapping_version: "v0-pending-verification"
dataset_version: "0.1.0-scaffold"

# All paths below are relative to the current working directory when a
# `target-cash` command runs (i.e. the repository root). Kept explicit so the
# CLI never hardcodes a location and can be pointed at an isolated directory
# (e.g. in tests) without touching real project data.
paths:
  cache_dir: "data/raw"
  curated_dir: "data/curated"
  db_filename: "target_cash.db"
  manifest_csv: "docs/sources.csv"
  schema_sql: "sql/schema.sql"
  views_sql: "sql/views.sql"
  metrics_csv: "config/metrics.csv"
